events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json application/manifest+json;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/manifest+json image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Redirecciones relativas (/generador-qr -> /generador-qr/) para no saltar a http:// detrás del proxy
        absolute_redirect off;

        # Security headers (las locations de abajo no usan add_header para heredarlos)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 404 real: evita que Google indexe URLs inexistentes como copias de la home
        error_page 404 /404.html;

        # PWA manifest with correct MIME type
        location = /manifest.webmanifest {
            types { }
            default_type application/manifest+json;
            expires -1;
        }

        # Service worker: siempre revalidar
        location = /sw.js {
            expires -1;
        }

        # Web Share Target (el POST lo intercepta el service worker)
        location = /share {
            try_files /share.html =404;
            # Sin service worker, nginx no acepta POST en estáticos: mostrar la página igualmente
            error_page 405 =200 /share.html;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        # Archivos internos que no deben ser públicos
        location ~ /\.(?!well-known/) {
            return 404;
        }

        location ~ ^/(?:Dockerfile|nginx\.conf)$ {
            return 404;
        }

        # HTML, CSS, JS y datos: revalidar siempre (ETag) para que los cambios lleguen al momento
        location ~* \.(?:html|css|js|json|xml|txt)$ {
            expires -1;
        }

        # Imágenes e iconos
        location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?)$ {
            expires 30d;
        }
    }
}
